name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install and Test API
      working-directory: ./labs/week-12/source/api
      run: |
        npm install
        npm test
        
    - name: Install and Test Frontend
      working-directory: ./labs/week-12/source/frontend
      run: |
        npm install
        npm test
